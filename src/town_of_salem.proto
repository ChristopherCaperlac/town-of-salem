syntax = "proto3";

service HelloService {
    rpc RegisterPlayer (LoginInfo) returns (LoginResponse);
    rpc SendMessage (ChatMessage) returns (Empty);
    rpc ReceiveMessages (AuthInfo) returns (stream ChatMessage);
}

message LoginInfo {
    string username = 1;
    string password = 2;
}

message AuthInfo {
    string user_id = 1;
}

message LoginResponse {
    int64 code = 1;
    string user_id = 2;
}

message ChatMessage {
    string user_id = 1;
    int64 timestamp = 2;
    string text = 3;
}

message Empty {
}